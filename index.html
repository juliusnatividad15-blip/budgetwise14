  --sage:#7BA88A;--sage-d:#4F7A5E;--sage-l:#E4F0E6;
  --peach:#E8A87C;--peach-l:#FCE8D8;--rose:#D4897A;--rose-l:#F9E4DE;
  --mint:#A8C5B0;--sky:#A8C4D4;--lav:#C4B0D4;
  --r:18px;--shadow:0 4px 16px rgba(90,70,40,.08),0 1px 3px rgba(90,70,40,.05);
  --shadow-lg:0 12px 32px rgba(90,70,40,.12);
}
html.dark{
  --bg:#1C201C;--paper:#252B26;--card:#2A322C;--muted:#343C36;--border:#3E4840;
  --text:#E6EDE8;--body:#C2CDC6;--soft:#8A968E;
  --sage:#7BAF8C;--sage-d:#5A9A72;--sage-l:#2A3D32;
  --peach:#D4A96A;--peach-l:#3D3428;--rose:#D4897A;--rose-l:#3D2A28;
  --mint:#5A7A62;--sky:#4A6A7A;--lav:#6A5A7A;
  --shadow:0 4px 16px rgba(0,0,0,.25);--shadow-lg:0 12px 32px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Quicksand,system-ui,sans-serif;background:var(--bg);color:var(--text);
background-image:radial-gradient(ellipse 50% 40% at 10% 0%,rgba(123,168,138,.1),transparent 55%),
radial-gradient(ellipse 45% 35% at 95% 5%,rgba(232,168,124,.08),transparent 50%);
background-attachment:fixed;min-height:100vh;transition:background .4s,color .35s}
html.dark body{background-image:radial-gradient(ellipse 50% 40% at 10% 0%,rgba(123,168,138,.15),transparent 55%),
radial-gradient(ellipse 45% 35% at 95% 5%,rgba(232,168,124,.06),transparent 50%)}
button{font-family:inherit;cursor:pointer;border:none;background:none;transition:transform .18s cubic-bezier(.22,1,.36,1),background .2s,color .2s,box-shadow .2s,filter .2s}
button:active{transform:scale(.95)}
input,select,textarea{font-family:inherit;background:var(--card);color:var(--text);border:1.5px solid var(--border);border-radius:14px;padding:10px 14px;font-size:14px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sage);box-shadow:0 0 0 3px rgba(123,168,138,.22)}
@keyframes pageIn{from{opacity:0;transform:translateY(12px) scale(.99)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes softBounce{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.page-enter{animation:pageIn .42s cubic-bezier(.22,1,.36,1) both}
.pop{animation:pop .32s cubic-bezier(.22,1,.36,1) both}
.fade{animation:fade .25s both}
.slide-up{animation:slideUp .35s cubic-bezier(.22,1,.36,1) both}
.card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);transition:background .35s,border-color .35s,transform .25s,box-shadow .25s}
.card:hover{box-shadow:var(--shadow-lg)}
.btn-primary{background:var(--sage);color:#fff;border-radius:14px;padding:12px 18px;font-weight:600;font-size:14px;box-shadow:0 3px 10px rgba(123,168,138,.3)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-danger{background:transparent;color:var(--rose);border:1.5px solid color-mix(in srgb,var(--rose) 40%,transparent);border-radius:14px;padding:12px 18px;font-weight:600;font-size:14px}
.btn-danger:hover{background:var(--rose-l)}
.btn-ghost{border:1.5px solid var(--border);border-radius:14px;padding:10px 16px;font-size:13px;color:var(--body)}
.btn-ghost:hover{background:var(--muted)}
.nav-pill{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--body);white-space:nowrap;transition:all .25s cubic-bezier(.22,1,.36,1)}
.nav-pill:hover{background:var(--muted);color:var(--sage-d)}
.nav-pill.active{background:var(--sage-d);color:#fff;box-shadow:0 3px 12px rgba(79,122,94,.35);transform:scale(1.03)}
.progress{height:9px;border-radius:999px;background:var(--muted);overflow:hidden}
.progress>i{display:block;height:100%;border-radius:999px;transition:width .55s cubic-bezier(.22,1,.36,1)}
.header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1.5px solid var(--border);transition:background .35s}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:100;padding:12px 20px;border-radius:14px;font-size:13px;font-weight:600;color:#fff;box-shadow:var(--shadow-lg);animation:slideUp .35s cubic-bezier(.22,1,.36,1)}
.overlay{position:fixed;inset:0;background:rgba(40,30,20,.35);backdrop-filter:blur(5px);z-index:60;animation:fade .2s both;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border-radius:22px;padding:24px;width:100%;max-width:400px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);border:1.5px solid var(--border);animation:pop .32s cubic-bezier(.22,1,.36,1)}
.cal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cal-cell{padding:10px 4px;border-radius:12px;font-size:12px;font-weight:600;text-align:center;color:var(--body);transition:all .2s}
.cal-cell:hover{background:var(--muted)}
.cal-cell.on{background:var(--sage-d);color:#fff;transform:scale(1.06);box-shadow:0 2px 8px rgba(79,122,94,.3)}
.hidden{display:none!important}
.avatar{width:80px;height:80px;border-radius:50%;background:var(--sage-d);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;margin:0 auto;box-shadow:0 4px 14px rgba(79,122,94,.25)}
@media(max-width:768px){
  .desk-nav{display:none!important}
  .mob-menu-btn{display:flex!important}
}
@media(min-width:769px){
  .mob-menu-btn{display:none!important}
  .mob-nav{display:none!important}
  .desk-nav{display:flex!important}
}
</style>

function calcAge(b){if(!b)return null;const d=new Date(b),n=new Date();let a=n.getFullYear()-d.getFullYear();const m=n.getMonth()-d.getMonth();if(m<0||(m===0&&n.getDate()<d.getDate()))a--;return a}
function walletNet(method, upToDate){
  const list=S.get('txs',[]);
  let n=0;
  list.filter(x=>(x.payment_method||'')===method).filter(x=>!upToDate||x.date<=upToDate).forEach(x=>{n+=x.type==='income'?+x.amount:-x.amount});
  return n;
}
function canPay(method, amount, date, type){
  if(type!=='expense')return {ok:1};
  const m=method||'';
  if(/credit/i.test(m)){
    const limit=S.get('creditLimit',25000);
    const used=Math.max(0,-walletNet('Credit Card', date));
    if(used+Number(amount)>limit)return {ok:0,msg:'Lampas sa credit limit ('+peso(limit)+').'};
    return {ok:1};
  }
  if(/cash|gcash|bank/i.test(m)){
    const bal=walletNet(m, date);
    if(bal<Number(amount))return {ok:0,msg:'Kulang ang '+m+' (available '+peso(Math.max(0,bal))+'). Gumamit ng Credit Card o maglagay muna ng funds.'};
    return {ok:1};
  }
  return {ok:1};
}
function pieSvg(entries, size=140){
  const total=entries.reduce((s,e)=>s+e.v,0)||1;
  const colors=entries.map(e=>e.color);
  let acc=0;
  const cx=size/2,cy=size/2,r=size/2-6,ri=r*0.55;
  const slices=entries.map((e,i)=>{
    const start=acc/total*2*Math.PI-Math.PI/2;
    acc+=e.v;
    const end=acc/total*2*Math.PI-Math.PI/2;
    const large=end-start>Math.PI?1:0;
    const x1=cx+r*Math.cos(start),y1=cy+r*Math.sin(start);
    const x2=cx+r*Math.cos(end),y2=cy+r*Math.sin(end);
    const xi1=cx+ri*Math.cos(start),yi1=cy+ri*Math.sin(start);
    const xi2=cx+ri*Math.cos(end),yi2=cy+ri*Math.sin(end);
    const d=`M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} L ${xi2} ${yi2} A ${ri} ${ri} 0 ${large} 0 ${xi1} ${yi1} Z`;
    return `<path d="${d}" fill="${e.color}" stroke="var(--card)" stroke-width="2"><title>${e.name}: ${peso(e.v)}</title></path>`;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${slices}<circle cx="${cx}" cy="${cy}" r="${ri-2}" fill="var(--card)"/><text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--text)">Expenses</text><text x="${cx}" y="${cy+12}" text-anchor="middle" font-size="10" fill="var(--soft)">${peso(total)}</text></svg>`;
}

function spent(cid,cname){return txs().filter(t=>t.type==='expense'&&(t.category_id===cid||(cname&&t.category_name===cname))).reduce((s,t)=>s+Number(t.amount),0)}
function csv(){const rows=[['Date','Description','Category','Type','Payment','Amount'],...txs().map(t=>[t.date,t.description||'',t.category_name||'',t.type,t.payment_method||'',t.amount])];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n')],{type:'text/csv'}));a.download=`budgetwise-${st.year}-${String(st.month).padStart(2,'0')}.csv`;a.click()}

$$('[data-dis]').forEach(b=>b.onclick=()=>{st.dismissed.push(b.dataset.dis);render()});

const cbg=$('#cal-bg');if(cbg)cbg.onclick=()=>{st.calOpen=0;render()};
const cp=$('#cal-prev');if(cp)cp.onclick=e=>{e.stopPropagation();st.year--;render()};
const cn=$('#cal-next');if(cn)cn.onclick=e=>{e.stopPropagation();st.year++;render()};
$$('[data-m]').forEach(b=>b.onclick=e=>{e.stopPropagation();st.month=+b.dataset.m;st.calOpen=0;render()});
const fl=$('#f-login');if(fl)fl.onsubmit=e=>{e.preventDefault();const fd=new FormData(fl);if(login(fd.get('email'),fd.get('password'))){toast('Welcome!');render()}else toast('Invalid credentials','err')};
const fr=$('#f-reg');if(fr)fr.onsubmit=e=>{e.preventDefault();const fd=new FormData(fr);const users=S.get('users',[]);const email=String(fd.get('email')).toLowerCase();if(users.some(u=>u.email===email)){toast('Email taken','err');return}users.push({id:uid(),name:fd.get('name'),email,password:fd.get('password'),role:'user'});S.set('users',users);login(email,fd.get('password'));toast('Account created');render()};
const ff=$('#f-forgot');if(ff)ff.onsubmit=e=>{e.preventDefault();const email=String(new FormData(ff).get('email')).toLowerCase();const users=S.get('users',[]);const u=users.find(x=>x.email===email);if(!u){toast('If email exists, reset sent');return}const temp='Reset'+Math.random().toString(36).slice(2,8)+'!';u.password=temp;S.set('users',users);st.resetEmail=email;st.tempPass=temp;st.auth='reset';toast('Temp password ready');render()};
const freset=$('#f-reset');if(freset)freset.onsubmit=e=>{e.preventDefault();const fd=new FormData(freset);if(fd.get('np')!==fd.get('np2')){toast('Mismatch','err');return}const users=S.get('users',[]);const u=users.find(x=>x.email===String(fd.get('email')).toLowerCase()&&x.password===fd.get('temp'));if(!u){toast('Invalid reset','err');return}u.password=fd.get('np');S.set('users',users);st.auth='login';toast('Password reset');render()};
$$('[data-ft]').forEach(b=>b.onclick=()=>{st.filter.type=b.dataset.ft;render()});
const tq=$('#tx-q');if(tq)tq.oninput=()=>{st.filter.q=tq.value;render()};
const tc=$('#tx-c');if(tc)tc.onchange=()=>{st.filter.cat=tc.value;render()};
const tp=$('#tx-p');if(tp)tp.onchange=()=>{st.filter.pay=tp.value;render()};
const tr=$('#tog-rec');if(tr)tr.onclick=()=>{st.showRec=!st.showRec;render()};
const at=$('#add-tx');if(at)at.onclick=()=>{const cats=S.get('cats',[]);st.modal=modal('Add Transaction',`<form id="f-tx" style="display:flex;flex-direction:column;gap:10px">
<div style="display:flex;gap:8px">${['expense','income'].map(t=>`<label style="flex:1;text-align:center;border:1.5px solid var(--border);border-radius:12px;padding:10px;font-size:13px"><input type="radio" name="type" value="${t}" ${t==='expense'?'checked':''}/> ${t}</label>`).join('')}</div>
<input name="amount" type="number" step="0.01" min="0.01" required placeholder="Amount"/>
<input name="date" type="date" required value="2026-09-07"/>
<select name="cat"><option value="">Category</option>${cats.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select>
<input name="desc" placeholder="Description"/>
<select name="pay" id="pay-select">${['Cash','GCash','Bank Transfer'].map(m=>`<option>${m}</option>`).join('')}</select>
<p style="font-size:11px;color:var(--soft)">Income: Cash / GCash / Bank only. Cards available for expenses.</p>
<div style="display:flex;gap:8px"><button class="btn-primary" style="flex:1">Save</button><button type="button" id="m-close" class="btn-ghost" style="flex:1">Cancel</button></div></form>`);render()};
const csvB=$('#btn-csv');if(csvB)csvB.onclick=()=>{csv();toast('CSV downloaded')};
$$('[data-dtx]').forEach(b=>b.onclick=()=>{S.set('txs',S.get('txs',[]).filter(t=>t.id!==b.dataset.dtx));toast('Deleted');render()});
$$('[data-dg]').forEach(b=>b.onclick=()=>{S.set('goals',S.get('goals',[]).filter(g=>g.id!==b.dataset.dg));toast('Removed');render()});
$$('[data-dd]').forEach(b=>b.onclick=()=>{S.set('debts',S.get('debts',[]).filter(d=>d.id!==b.dataset.dd));toast('Removed');render()});
const ag=$('#add-goal');if(ag)ag.onclick=()=>{st.modal=modal('New Goal',`<form id="f-goal" style="display:flex;flex-direction:column;gap:10px">
<input name="name" required placeholder="Goal name"/><input name="target" type="number" step="0.01" required placeholder="Target"/>
<input name="cur" type="number" step="0.01" value="0" placeholder="Current"/><input name="deadline" type="date"/>
<div style="display:flex;gap:8px"><button class="btn-primary" style="flex:1">Save</button><button type="button" id="m-close" class="btn-ghost" style="flex:1">Cancel</button></div></form>`);render()};
const ad=$('#add-debt');if(ad)ad.onclick=()=>{st.modal=modal('Add Debt',`<form id="f-debt" style="display:flex;flex-direction:column;gap:10px">
<input name="name" required placeholder="Name"/><input name="total" type="number" step="0.01" required placeholder="Total"/>
<input name="paid" type="number" step="0.01" value="0" placeholder="Paid"/><input name="inst" type="number" step="0.01" placeholder="Monthly"/>
<input name="due" type="number" min="1" max="31" placeholder="Due day"/><input name="cred" placeholder="Creditor"/>
<div style="display:flex;gap:8px"><button class="btn-primary" style="flex:1">Save</button><button type="button" id="m-close" class="btn-ghost" style="flex:1">Cancel</button></div></form>`);render()};
const mc=$('#m-close');if(mc)mc.onclick=()=>{st.modal=null;render()};
const mb=$('#modal-bg');if(mb)mb.onclick=e=>{if(e.target===mb){st.modal=null;render()}};
const paySel=$('#pay-select');$$('#f-tx input[name=type]').forEach(r=>r.onchange=()=>{if(!paySel)return;const income=r.value==='income'&&r.checked;const opts=income?['Cash','GCash','Bank Transfer']:PM;const cur=paySel.value;paySel.innerHTML=opts.map(m=>`<option>${m}</option>`).join('');if(opts.includes(cur))paySel.value=cur;});
const ftx=$('#f-tx');if(ftx)ftx.onsubmit=e=>{e.preventDefault();const fd=new FormData(ftx);const type=fd.get('type'),amount=+fd.get('amount'),date=fd.get('date'),pay=fd.get('pay');const chk=canPay(pay,amount,date,type);if(!chk.ok){toast(chk.msg,'err');return}const cats=S.get('cats',[]);const cat=cats.find(c=>c.id===fd.get('cat'));const list=S.get('txs',[]);list.unshift({id:uid(),type,amount,date,description:fd.get('desc'),category_id:fd.get('cat')||null,category_name:cat?.name||'',payment_method:pay});S.set('txs',list);st.modal=null;toast('Saved');render()};
const fg=$('#f-goal');if(fg)fg.onsubmit=e=>{e.preventDefault();const fd=new FormData(fg);const g=S.get('goals',[]);g.push({id:uid(),name:fd.get('name'),target:+fd.get('target'),current:+fd.get('cur')||0,deadline:fd.get('deadline')||null});S.set('goals',g);st.modal=null;toast('Goal created');render()};
const fd_=$('#f-debt');if(fd_)fd_.onsubmit=e=>{e.preventDefault();const fd=new FormData(fd_);const d=S.get('debts',[]);d.push({id:uid(),name:fd.get('name'),total:+fd.get('total'),paid:+fd.get('paid')||0,inst:fd.get('inst')?+fd.get('inst'):null,due:fd.get('due')?+fd.get('due'):null,creditor:fd.get('cred')||'',status:'active'});S.set('debts',d);st.modal=null;toast('Debt added');render()};
const ep=$('#edit-prof');if(ep)ep.onclick=()=>{st.editProf=1;render()};
const da=$('#del-acc');if(da)da.onclick=()=>{st.delStep=1;render()};
const db=$('#del-back');if(db)db.onclick=()=>{st.delStep=0;render()};
const dok=$('#del-ok');if(dok)dok.onclick=()=>{const reqs=S.get('reqs',[]).filter(r=>!(r.user_id===st.user.id&&r.status==='pending'));reqs.push({id:uid(),user_id:st.user.id,requested_name:'__DELETE__',requested_email:null,status:'pending'});S.set('reqs',reqs);st.delStep=0;toast('Delete request sent to admin');render()};
const cr=$('#cancel-req');if(cr)cr.onclick=()=>{S.set('reqs',S.get('reqs',[]).filter(r=>r.id!==cr.dataset.rid));toast('Cancelled');render()};
const fdet=$('#f-details');if(fdet)fdet.onsubmit=e=>{e.preventDefault();const fd=new FormData(fdet);syncUser({birthday:fd.get('birthday')||null,sex:fd.get('sex')||null});toast('Details saved');st.editProf=0;render()};
const fi=$('#f-info');if(fi)fi.onsubmit=e=>{e.preventDefault();const fd=new FormData(fi);const name=String(fd.get('name')).trim(),email=String(fd.get('email')).trim().toLowerCase();if(st.infoStep===0){if(name===st.user.name&&email===st.user.email){toast('No changes','err');return}st.infoStep=1;render();return}if(st.user.role==='admin'){syncUser({name,email});toast('Updated')}else{const reqs=S.get('reqs',[]).filter(r=>!(r.user_id===st.user.id&&r.status==='pending'));reqs.push({id:uid(),user_id:st.user.id,requested_name:name!==st.user.name?name:null,requested_email:email!==st.user.email?email:null,status:'pending'});S.set('reqs',reqs);toast('Request sent')}st.infoStep=0;st.editProf=0;render()};
const ib=$('#info-back');if(ib)ib.onclick=()=>{if(st.infoStep===1)st.infoStep=0;else st.editProf=0;render()};
const fp=$('#f-pass');if(fp)fp.onsubmit=e=>{e.preventDefault();const fd=new FormData(fp);const p1=fd.get('p1'),p2=fd.get('p2'),p3=fd.get('p3');if(!p1||p1.length<6){toast('Min 6 chars','err');return}if(p1!==p2){toast('Mismatch','err');return}if(st.passStep===0){st.passStep=1;render();return}if(p1!==p3){toast('2nd confirm mismatch','err');return}const users=S.get('users',[]);const u=users.find(x=>x.id===st.user.id);if(u){u.password=p1;S.set('users',users)}st.passStep=0;toast('Password updated');render()};
const pb=$('#pass-back');if(pb)pb.onclick=()=>{st.passStep=0;render()};
$$('[data-ap]').forEach(b=>b.onclick=()=>{const reqs=S.get('reqs',[]);const r=reqs.find(x=>x.id===b.dataset.ap);if(!r)return;r.status='approved';const users=S.get('users',[]);const u=users.find(x=>x.id===r.user_id);if(u&&r.requested_name!=='__DELETE__'){if(r.requested_name)u.name=r.requested_name;if(r.requested_email)u.email=r.requested_email;S.set('users',users);if(st.user&&st.user.id===u.id)syncUser({name:u.name,email:u.email})}if(r.requested_name==='__DELETE__'&&u){S.set('users',users.filter(x=>x.id!==u.id));if(st.user&&st.user.id===u.id)logout()}S.set('reqs',reqs);toast('Approved');render()});
$$('[data-rj]').forEach(b=>b.onclick=()=>{const reqs=S.get('reqs',[]);const r=reqs.find(x=>x.id===b.dataset.rj);if(r)r.status='rejected';S.set('reqs',reqs);toast('Rejected');render()});
const ac=$('#add-cat');if(ac)ac.onclick=()=>{const cols=['#7BA88A','#E8A87C','#D4897A','#A8C4D4','#C4B0D4','#E0B15C','#8BA888','#F0B8C8','#7A9E9F','#B5D0AD','#D4A5A5','#9DC3C2'];st.modal=modal('Add Category',`<form id="f-cat" style="display:flex;flex-direction:column;gap:10px">
<input name="name" required placeholder="Name"/>
<div style="display:flex;gap:8px">${['expense','income'].map(t=>`<label style="flex:1;text-align:center;border:1.5px solid var(--border);border-radius:12px;padding:10px;font-size:13px"><input type="radio" name="type" value="${t}" ${t==='expense'?'checked':''}/> ${t}</label>`).join('')}</div>
<div style="font-size:12px;color:var(--body);margin-bottom:4px">Color</div>
<div style="display:flex;flex-wrap:wrap;gap:8px">${cols.map((c,i)=>`<label style="cursor:pointer"><input type="radio" name="color" value="${c}" ${i===0?'checked':''} style="display:none"/><span data-swatch style="display:inline-block;width:28px;height:28px;border-radius:50%;background:${c};box-shadow:0 0 0 2px transparent;transition:transform .15s"></span></label>`).join('')}</div>
<div style="display:flex;gap:8px;margin-top:8px"><button class="btn-primary" style="flex:1">Save</button><button type="button" id="m-close" class="btn-ghost" style="flex:1">Cancel</button></div></form>`);render();$$('[data-swatch]').forEach(s=>{const inp=s.parentElement.querySelector('input');const sync=()=>{$$('[data-swatch]').forEach(x=>x.style.boxShadow='0 0 0 2px transparent');if(inp.checked)s.style.boxShadow='0 0 0 3px var(--sage-d)';s.style.transform=inp.checked?'scale(1.15)':'scale(1)'};inp.onchange=sync;s.onclick=()=>{inp.checked=true;sync()};if(inp.checked)sync()})};
const fc=$('#f-cat');if(fc)fc.onsubmit=e=>{e.preventDefault();const fd=new FormData(fc);const cats=S.get('cats',[]);cats.push({id:uid(),name:fd.get('name'),type:fd.get('type'),color:fd.get('color')||'#7BA88A'});S.set('cats',cats);st.modal=null;toast('Added');render()};
const ab=$('#add-bud');if(ab)ab.onclick=()=>{const cats=S.get('cats',[]).filter(c=>c.type==='expense');st.modal=modal('Set Budget',`<form id="f-bud" style="display:flex;flex-direction:column;gap:10px">
<select name="cat" required>${cats.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select>
<input name="amount" type="number" step="0.01" required placeholder="Amount"/>
<div style="display:flex;gap:8px"><button class="btn-primary" style="flex:1">Save</button><button type="button" id="m-close" class="btn-ghost" style="flex:1">Cancel</button></div></form>`);render()};
const fb=$('#f-bud');if(fb)fb.onsubmit=e=>{e.preventDefault();const fd=new FormData(fb);const cats=S.get('cats',[]);const cat=cats.find(c=>c.id===fd.get('cat'));const buds=S.get('buds',[]);buds.push({id:uid(),category_id:fd.get('cat'),category_name:cat?.name||'',amount:+fd.get('amount'),month:st.month,year:st.year});S.set('buds',buds);st.modal=null;toast('Budget set');render()};
const ar=$('#add-rec');if(ar)ar.onclick=()=>{st.modal=modal('Add Recurring',`<form id="f-rec" style="display:flex;flex-direction:column;gap:10px">
<div style="display:flex;gap:8px">${['expense','income'].map(t=>`<label style="flex:1;text-align:center;border:1.5px solid var(--border);border-radius:12px;padding:10px;font-size:13px"><input type="radio" name="type" value="${t}" ${t==='expense'?'checked':''}/> ${t}</label>`).join('')}</div>
<input name="desc" required placeholder="Description"/><input name="amount" type="number" step="0.01" required placeholder="Amount"/>
<input name="day" type="number" min="1" max="28" value="1" required placeholder="Day of month"/>
<select name="pay">${PM.map(m=>`<option>${m}</option>`).join('')}</select>
<div style="display:flex;gap:8px"><button class="btn-primary" style="flex:1">Save</button><button type="button" id="m-close" class="btn-ghost" style="flex:1">Cancel</button></div></form>`);render()};
const fre=$('#f-rec');if(fre)fre.onsubmit=e=>{e.preventDefault();const fd=new FormData(fre);const rec=S.get('rec',[]);rec.push({id:uid(),type:fd.get('type'),amount:+fd.get('amount'),description:fd.get('desc'),day:+fd.get('day'),pay:fd.get('pay'),active:1});S.set('rec',rec);st.modal=null;toast('Rule added');render()};
}

function render(){
dark();seed();
const root=$('#app');
if(!st.user){root.innerHTML=authUI();bind();return}
const pages={dashboard:pageDash,transactions:pageTx,categories:pageCats,reports:pageRep,goals:pageGoals,debts:pageDebts,profile:pageProf,'admin-users':pageAdminUsers,'admin-requests':pageAdminReq,'admin-analytics':pageAdminAn};
root.innerHTML=shell((pages[st.page]||pageDash)());
bind();
}
seed();dark();render();
</script>
</body>
</html>
